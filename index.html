<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="app" class="app hidden">

    <section id="composeView" class="view">
      <section class="composer">
        <div class="composer-row">
          <input type="date" id="entryDate" class="mono-input">
          <input type="time" id="entryTime" class="mono-input">
        </div>
        <textarea id="entryBody" rows="3"></textarea>
        <textarea id="entryMemo" class="memo-textarea" rows="3"></textarea>
        <div class="composer-actions">
          <span id="editingIndicator" class="editing-indicator hidden">항목 수정 중</span>
          <button id="cancelEditBtn" class="btn-ghost small hidden">취소</button>
          <button id="saveBtn" class="btn-primary">등록</button>
        </div>
      </section>
    </section>

    <section id="listView" class="view hidden">
      <section class="toolbar">
        <input type="text" id="searchInput">
        <button id="menuToggleBtn" class="icon-btn" title="설정" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="17" x2="20" y2="17"></line>
          </svg>
        </button>
      </section>

      <div id="settingsMenu" class="settings-menu">
        <button id="refreshBtn" class="settings-menu-item">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8 8 0 10-2.34 5.66"></path>
            <polyline points="20 4 20 11 13 11"></polyline>
          </svg>
          <span>새로고침</span>
        </button>
        <button id="themeToggleBtn" class="settings-menu-item">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"></path>
          </svg>
          <span>화면 모드</span>
        </button>
      </div>

      <section class="log-list" id="logList">
        <!-- entries rendered here -->
      </section>

      <p id="emptyState" class="empty-state hidden">아직 기록이 없어요. 첫 로그를 남겨보세요.</p>
    </section>

    <section id="calendarView" class="view hidden">
      <section class="calendar-header">
        <button id="calPrevBtn" class="icon-btn" title="이전 달">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span id="calMonthLabel" class="calendar-month-label"></span>
        <button id="calNextBtn" class="icon-btn" title="다음 달">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </section>

      <section class="calendar-grid calendar-weekdays">
        <span class="calendar-weekday">일</span>
        <span class="calendar-weekday">월</span>
        <span class="calendar-weekday">화</span>
        <span class="calendar-weekday">수</span>
        <span class="calendar-weekday">목</span>
        <span class="calendar-weekday">금</span>
        <span class="calendar-weekday">토</span>
      </section>

      <section class="calendar-grid" id="calendarGrid">
        <!-- 날짜 셀 렌더링 위치 -->
      </section>

      <section class="calendar-log-list" id="calendarLogList">
        <!-- 이번 달 로그 목록 렌더링 위치 -->
      </section>

      <p id="calendarEmptyState" class="empty-state hidden">이 달에는 기록이 없어요.</p>
    </section>

  </main>

  <button id="viewPrevBtn" class="fab-nav fab-nav-left hidden" title="이전 화면">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button id="viewNextBtn" class="fab-nav fab-nav-right hidden" title="다음 화면">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <div id="statusBar" class="status-bar hidden"></div>

  <section id="gate" class="gate">
    <div class="gate-inner">      
      <h2>로그를 시작하려면<br>구글 계정을 연결하세요</h2>
      <p class="gate-sub">기록은 본인의 구글 드라이브 폴더에 저장됩니다.</p>
      <button id="authBtnGate" class="btn-primary">구글 계정 연결</button>
    </div>
  </section>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="script.js"></script>
</body>
</html>
