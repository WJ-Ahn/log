<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="app" class="app hidden">

    <section id="composeView" class="view">
      <section class="composer">
        <div class="composer-row">
          <input type="date" id="entryDate" class="mono-input">
          <input type="time" id="entryTime" class="mono-input">
        </div>
        <textarea id="entryBody" rows="3"></textarea>
        <div class="composer-actions">
          <span id="editingIndicator" class="editing-indicator hidden">항목 수정 중</span>
          <button id="cancelEditBtn" class="btn-ghost small hidden">취소</button>
          <button id="saveBtn" class="btn-primary">등록</button>
        </div>
      </section>
    </section>

    <section id="listView" class="view hidden">
      <section class="toolbar">
        <input type="text" id="searchInput" placeholder="검색 (본문, #태그)">
        <button id="refreshBtn" class="btn-ghost small" title="다시 불러오기">↻</button>
      </section>

      <section class="log-list" id="logList">
        <!-- entries rendered here -->
      </section>

      <p id="emptyState" class="empty-state hidden">아직 기록이 없어요. 첫 로그를 남겨보세요.</p>
    </section>

  </main>

  <button id="viewToggleBtn" class="fab hidden" title="화면 전환">⇄</button>

  <div id="statusBar" class="status-bar hidden"></div>

  <section id="gate" class="gate">
    <div class="gate-inner">
      <span class="brand-mark large">▍</span>
      <h2>로그를 시작하려면<br>구글 계정을 연결하세요</h2>
      <p class="gate-sub">기록은 본인의 구글 드라이브 폴더에 저장됩니다.</p>
      <button id="authBtnGate" class="btn-primary">구글 계정 연결</button>
    </div>
  </section>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="script.js"></script>
</body>
</html>
